# Keeps the Render free-tier instance awake.
#
# Render suspends a free web service after ~15 minutes without traffic, and the
# cold start back is 30-90 seconds. This is a live portfolio link, so that wait
# lands on whoever clicks it first -- with no copy explaining why, since the
# warning the frontend used to show was removed.
#
# GitHub's scheduler is best-effort: a */10 schedule is frequently delivered
# late under load, occasionally by more than five minutes, which is enough to
# miss the 15-minute window. That is why this pings twice per run, and why
# UptimeRobot or cron-job.org is still the more reliable option if the link is
# going in front of someone on a known date.
#
# Also note: GitHub disables scheduled workflows on repositories with no commit
# activity for 60 days. It will need a nudge if the project goes quiet.

name: Keep Render awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:        # so it can be triggered by hand before a demo

permissions:
  contents: read

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health
        run: |
          URL="https://signal-v2-8ndy.onrender.com/health"

          ping() {
            # --max-time 120 because a cold start legitimately takes up to 90s;
            # a shorter timeout would report failure for a service that is
            # merely waking up.
            code=$(curl -s -o /tmp/body.txt -w "%{http_code}" \
                     --max-time 120 "$URL" || echo "000")
            echo "$1: HTTP $code $(cat /tmp/body.txt 2>/dev/null | head -c 100)"
            [ "$code" = "200" ]
          }

          if ping "attempt 1"; then exit 0; fi

          # First ping may have absorbed the cold start. Give it a moment and
          # confirm the service actually came up rather than failing outright.
          sleep 30
          if ping "attempt 2"; then exit 0; fi

          echo "::error::/health did not return 200 after two attempts"
          exit 1
